[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geoscape-sphinx-theme"
# EXACT version only (PEP 440: MAJOR.MINOR.PATCH, no "v" prefix, never "v1").
# On every release this MUST be bumped and MUST match the exact git tag:
#   here 1.0.4   <->   git tag v1.0.4   (the moving `v1` tag also moves to it)
# Bumping this is what makes pip re-install the theme on consumers — a moved
# git tag alone is NOT enough. Also update __version__ in
# src/geoscape_sphinx_theme/__init__.py to the same value. See README "Releasing".
version = "1.0.5"
description = "Shadcn-inspired Geoscape documentation theme for Sphinx (inherits from alabaster)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Geoscape" }]
dependencies = [
    "sphinx>=4.0",
    "alabaster>=0.7.12",
]

[project.entry-points."sphinx.html_themes"]
geoscape = "geoscape_sphinx_theme"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geoscape_sphinx_theme = [
    "theme/geoscape/*.*",
    "theme/geoscape/static/*",
]
