{%- extends "alabaster/layout.html" %}

{%- block extrahead %}
{{ super() }}
<script>
  (function () {
    try {
      var stored = null;
      try { stored = localStorage.getItem('gs-theme'); } catch (e) {}
      var state = stored || 'auto';
      var resolved = state;
      if (state === 'auto') {
        resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', state);
      if (resolved === 'dark') {
        document.documentElement.classList.add('dark-mode-pre');
      }
    } catch (e) {}
  })();
</script>
{%- endblock %}

{%- block header %}
<header class="gs-topbar" role="banner">
  <button type="button"
          class="gs-nav-toggle"
          aria-label="Toggle navigation"
          aria-expanded="false"
          aria-controls="gs-sidebar">
    {#- lucide: panel-left — the same icon the hub's <SidebarTrigger> uses. -#}
    <svg class="gs-nav-toggle__icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
  </button>
  <button type="button"
          class="gs-theme-toggle"
          aria-label="Theme: auto"
          data-theme-state="auto">
    <span class="gs-theme-toggle__label">Auto</span>
  </button>
</header>
<div class="gs-backdrop" hidden></div>
{%- endblock %}
