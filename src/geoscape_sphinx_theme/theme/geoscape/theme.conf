[theme]
inherit = alabaster
pygments_style = default
sidebars = about.html, searchbox.html, navigation.html, relations.html

[options]
extra_nav_links =
# Show the per-page "On this page" local table of contents in the sidebar.
# Set to false in a consumer's html_theme_options to hide it.
show_local_toc = true
# Click a content image to open a zoomable, downloadable preview overlay.
# Set to false in a consumer's html_theme_options to skip the extra CSS/JS.
show_image_preview = true
show_relbars = true
fixed_sidebar = true
sidebar_includehidden = true
# Mark the docs-home landing repo (docs_geoscape). When true, the theme drops
# two things that are redundant *only* on the site's own home page: the sidebar
# project-title block (the topbar wordmark already carries the brand) and the
# self-referential "back to docs home" sidebar link. Leave false everywhere else.
docs_home = false
