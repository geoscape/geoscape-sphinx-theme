[theme]
inherit = alabaster
pygments_style = default
sidebars = about.html, searchbox.html, navigation.html, relations.html

[options]
# Extra sidebar links as a {label: url} mapping (set in a consumer's
# html_theme_options). Rendered as the external-links list at the foot of the
# sidebar nav, each with an external-link icon. Empty by default.
extra_nav_links =
# Show the per-page "On this page" local table of contents in the sidebar.
# Set to false in a consumer's html_theme_options to hide it.
show_local_toc = true
# Click a content image to open a zoomable, downloadable preview overlay.
# Set to false in a consumer's html_theme_options to skip the extra CSS/JS.
show_image_preview = true
# In-page search for singlehtml builds. The singlehtml builder produces no
# search index or search.html, so the native search box can't work; instead the
# theme renders a sidebar box that finds + highlights matches within the one
# page (same look and "Hide Search Matches" affordance as the html search).
# Only ever active on singlehtml builds; set to false to drop it there.
singlehtml_search = true
# PostHog product analytics. ON by default using Geoscape's shared project key,
# which is hardcoded in __init__.py (_POSTHOG_KEY) — NOT here — so the default
# lives in one place. These entries only DECLARE the options so a consumer may
# override them in html_theme_options: set posthog_key to "" to opt a repo out,
# or to another phc_ key to redirect its analytics; set posthog_host for a
# non-US-cloud region (e.g. https://eu.i.posthog.com).
posthog_key =
posthog_host =
# Make each top-level subsection (h2) click-to-collapse, expanded by default.
# Set to false in a consumer's html_theme_options to skip the extra CSS/JS.
collapsible_sections = true
# Show the relation bars (previous / next / parent page links) at the top and
# bottom of each page. Inherited from alabaster.
show_relbars = true
# Keep the sidebar fixed in place while the content scrolls, rather than letting
# it scroll away with the page. Inherited from alabaster.
fixed_sidebar = true
sidebar_includehidden = true
# Mark the docs-home landing repo (docs_geoscape). When true, the theme drops
# two things that are redundant *only* on the site's own home page: the sidebar
# project-title block (the topbar wordmark already carries the brand) and the
# self-referential "back to docs home" sidebar link. Leave false everywhere else.
docs_home = false
